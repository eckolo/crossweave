<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>crossweave — 拠点・準備・帰還</title><style>body{margin:0;padding:16px;max-width:1440px;margin-inline:auto;background:light-dark(#f6f6f0,#171f1b);color-scheme:light dark;font-family:system-ui,sans-serif}</style></head><body><div id="crossweave-flow-001" lang="ja">
  <style>#crossweave-flow-001 {color-scheme:light dark;--cf-ink:light-dark(#243a34,#ecebdd);--cf-muted:light-dark(#52675e,#b9c1b8);--cf-paper:light-dark(#eee9d9,#293330);--cf-line:light-dark(#bec6b6,#56645c);--cf-accent:light-dark(#3d6556,#a5c3a5);--cf-active:light-dark(#34594c,#b5c9a9);--cf-active-ink:light-dark(#f9f6e8,#182c23);--cf-warn:light-dark(#a1432e,#f1aa89);--cf-shadow:light-dark(#24382d25,#00000060);font:14px/1.5 system-ui,"Noto Sans JP",sans-serif;color:var(--cf-ink);background:transparent;width:100%;min-width:0}
#crossweave-flow-001 *,#crossweave-flow-001 *::before,#crossweave-flow-001 *::after {box-sizing:border-box}
#crossweave-flow-001 [hidden]{display:none!important}
#crossweave-flow-001 button,#crossweave-flow-001 select {font:inherit;color:inherit}
#crossweave-flow-001 button {cursor:pointer;touch-action:manipulation}
#crossweave-flow-001 button:disabled {cursor:default;opacity:.45}
#crossweave-flow-001 button:focus-visible,#crossweave-flow-001 select:focus-visible {outline:2px solid var(--cf-accent);outline-offset:3px}
#crossweave-flow-001 h2,#crossweave-flow-001 h3,#crossweave-flow-001 p {margin:0}
#crossweave-flow-001 h2{font-size:24px;font-weight:500}#crossweave-flow-001 h3{font-size:17px;font-weight:500}
#crossweave-flow-001 i[data-lucide]{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;font-style:normal}
#crossweave-flow-001 i[data-lucide]::before{content:attr(data-fallback)}
#crossweave-flow-001 svg.lucide{width:18px;height:18px;flex:none;stroke-width:1.6}
#crossweave-flow-001 .cf-example-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin-bottom:8px;color:var(--cf-muted);font-size:12px}
#crossweave-flow-001 .cf-example-bar label{display:flex;align-items:center;gap:6px}
#crossweave-flow-001 .cf-example-bar select{background:var(--cf-paper);border:1px solid var(--cf-line);border-radius:4px;padding:3px 6px;max-width:100%}
#crossweave-flow-001 .cf-shell{position:relative;isolation:isolate;display:flex;flex-direction:column;width:100%;max-width:1440px;margin-inline:auto;aspect-ratio:16/9;min-height:500px;overflow:hidden;background:light-dark(#c0b997,#262c2b);border-radius:8px;box-shadow:0 8px 32px var(--cf-shadow)}
#crossweave-flow-001 .cf-scene{position:absolute;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(ellipse at 32% 25%,light-dark(#d7c79199,#a6975545),transparent 56%),linear-gradient(120deg,light-dark(#b4baa4,#34403b),light-dark(#a89879,#34302c))}
#crossweave-flow-001 .cf-light{position:absolute;inset:0;background:linear-gradient(118deg,transparent 17%,light-dark(#f8e5a845,#d5c28218) 18%,transparent 70%)}
#crossweave-flow-001 .cf-window-light{position:absolute;left:12%;top:9%;width:23%;height:44%;border:12px solid light-dark(#6d786a,#313e38);background:linear-gradient(90deg,transparent 47%,light-dark(#6d786a,#313e38) 47% 53%,transparent 53%),linear-gradient(0deg,transparent 44%,light-dark(#6d786a,#313e38) 44% 50%,transparent 50%),linear-gradient(140deg,light-dark(#e4dfb9,#8f9a82),light-dark(#a4b2a4,#556d64));box-shadow:0 0 65px light-dark(#ffefae40,#b7ad6930);transform:rotate(-2deg)}
#crossweave-flow-001 .cf-shelves{position:absolute;right:6%;top:12%;width:31%;height:52%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;padding:12px;background:light-dark(#666759,#1e2925);border:9px solid light-dark(#8a8169,#4d4d40);transform:rotate(1deg)}
#crossweave-flow-001 .cf-shelves b{align-self:end;height:73%;margin-inline:10%;background:light-dark(#adb095,#576859);border-radius:45% 35% 8% 6%;box-shadow:inset 10px 2px 0 light-dark(#c1c0a3,#677364)}
#crossweave-flow-001 .cf-shelves b:nth-child(2n){height:90%;border-radius:5% 35% 10% 4%;background:light-dark(#9c8a6e,#73664c);transform:rotate(-5deg)}
#crossweave-flow-001 .cf-shelves b:nth-child(3n){height:42%;border-radius:50%;background:light-dark(#b3b4aa,#747f76)}
#crossweave-flow-001 .cf-curtain{position:absolute;left:42%;top:9%;height:65%;width:13%;background:linear-gradient(90deg,light-dark(#7b8d80,#40534a),light-dark(#8fa091,#4c6455),light-dark(#63776c,#253e35));border-radius:4% 0 25% 3%;box-shadow:10px 0 16px var(--cf-shadow)}
#crossweave-flow-001 .cf-floor{position:absolute;inset:64% -5% -15%;background:repeating-linear-gradient(90deg,transparent 0 14%,light-dark(#4c463716,#12191622) 14% 14.5%),linear-gradient(light-dark(#8f8165,#474237),light-dark(#b2a37d,#645b46));transform:perspective(450px) rotateX(25deg)}
#crossweave-flow-001 .cf-counter{position:absolute;right:9%;bottom:16%;width:48%;height:23%;background:linear-gradient(light-dark(#b5a17d,#8b7957) 0 9%,light-dark(#887d62,#534e3e) 9% 13%,light-dark(#92886d,#494d3e) 13% 100%);border-radius:9px 3px 2px 2px;box-shadow:0 20px 28px var(--cf-shadow)}
#crossweave-flow-001 .cf-lamp{position:absolute;right:19%;bottom:39%;height:15%;width:8%;background:linear-gradient(transparent 0 60%,light-dark(#686954,#3b4e3a) 60%);clip-path:polygon(20% 0,80% 0,100% 60%,58% 63%,58% 94%,88% 94%,88% 100%,12% 100%,12% 94%,42% 94%,42% 63%,0 60%);background-color:light-dark(#d2c699,#b5b48a)}
#crossweave-flow-001 .cf-top{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:10px 22px;min-height:40px;background:light-dark(#ede9d331,#13282030);font-size:12px;color:light-dark(#2e463a,#dfe5d4)}
#crossweave-flow-001 .cf-stage{position:relative;flex:1;min-height:0;margin:0 18px}
#crossweave-flow-001 .cf-stage>section{height:100%;min-height:0}
#crossweave-flow-001 .cf-bottom{position:relative;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:7px 16px;background:light-dark(#eee9dbea,#26332fea);backdrop-filter:blur(4px);min-height:48px;border-top:1px solid light-dark(#eff3df55,#a0b59635)}
#crossweave-flow-001 .cf-self{display:flex;gap:14px;font-size:12px;white-space:nowrap}
#crossweave-flow-001 nav{display:flex;gap:6px;align-items:center;min-width:0}
#crossweave-flow-001 .cf-primary,#crossweave-flow-001 .cf-quiet{display:inline-flex;justify-content:center;gap:7px;align-items:center;border-radius:5px;min-height:32px;border:1px solid transparent;padding:5px 10px;text-decoration:none;white-space:nowrap}
#crossweave-flow-001 .cf-primary{background:var(--cf-active);color:var(--cf-active-ink)}
#crossweave-flow-001 .cf-quiet{background:light-dark(#d0d6c62b,#536b552d)}
#crossweave-flow-001 .cf-quiet:hover{border-color:var(--cf-line)}
#crossweave-flow-001 button[aria-expanded=true]{box-shadow:inset 0 -2px var(--cf-accent)}
#crossweave-flow-001 .cf-text-button{border:0;background:none;padding:0;color:var(--cf-muted);text-align:left}
#crossweave-flow-001 .cf-small{font-size:12px;color:var(--cf-muted)}
#crossweave-flow-001 .cf-shop-title{position:absolute;left:3%;top:5%;color:light-dark(#233e30,#f0ecce);text-shadow:0 1px 10px var(--cf-shadow)}
#crossweave-flow-001 .cf-shop-title>span{letter-spacing:.16em;font-size:12px}
#crossweave-flow-001 .cf-shop-title h2{font-size:30px}
#crossweave-flow-001 .cf-request-paper{position:absolute;left:14%;top:36%;width:260px;max-width:75%;padding:26px 24px;display:grid;gap:10px;text-align:left;transform:rotate(-2deg);border:none;background:light-dark(#f3edcf,#d3c8a2);color:#2b3e30;box-shadow:1px 10px 18px var(--cf-shadow)}
#crossweave-flow-001 .cf-request-paper .cf-small{color:#5a6955}
#crossweave-flow-001 .cf-request-paper strong{font-size:22px;font-weight:500}
#crossweave-flow-001 .cf-request-paper:hover{transform:rotate(0);box-shadow:1px 13px 20px var(--cf-shadow)}
#crossweave-flow-001 .cf-pin-dot{position:absolute;top:9px;left:48%;height:7px;width:7px;border-radius:50%;background:#787557;box-shadow:0 1px 3px #27372d70}
#crossweave-flow-001 .cf-paper-go{position:absolute;right:13px;bottom:8px}
#crossweave-flow-001 .cf-hub-message{position:absolute;right:6%;bottom:11%;max-width:45%;color:light-dark(#243c2d,#e5e7d2);padding:9px 12px;background:light-dark(#d5d4b8aa,#24372caa);border-radius:4px}
#crossweave-flow-001 .cf-hub-message:empty{display:none}
#crossweave-flow-001 #cf-preparation{display:flex;flex-direction:column;padding:12px 14px 4px;background:light-dark(#eeeadddf,#26332fe3);border-radius:8px 8px 0 0;backdrop-filter:blur(3px)}
#crossweave-flow-001 .cf-prep-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 13px}
#crossweave-flow-001 .cf-prep-heading .cf-quiet{flex-wrap:wrap}
#crossweave-flow-001 .cf-prep-heading .cf-quiet span{color:var(--cf-muted);font-size:12px}
#crossweave-flow-001 .cf-deck-heading{display:flex;justify-content:space-between;gap:12px;padding:7px 2px;border-bottom:1px solid var(--cf-line)}
#crossweave-flow-001 #cf-total{margin-left:10px;font-variant-numeric:tabular-nums}
#crossweave-flow-001 #cf-balance{color:var(--cf-muted);font-size:12px}
#crossweave-flow-001 .cf-collection{position:relative;flex:1;min-height:0}
#crossweave-flow-001 .cf-card-grid{height:100%;overflow:auto;scrollbar-width:thin;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(126px,1fr);align-content:start;gap:12px;padding:14px 4px 20px}
#crossweave-flow-001 .cf-card{position:relative;min-width:0;display:grid;grid-template-rows:1fr auto;gap:4px;background:light-dark(#e1e1ce,#374a3c);color:var(--cf-ink);border:1px solid light-dark(#aab39a,#617662);border-radius:8px;padding:8px;text-align:left;box-shadow:0 3px 7px var(--cf-shadow);min-height:126px}
#crossweave-flow-001 .cf-card.zero{filter:saturate(.3);background:light-dark(#dbdfd4,#303c36);border-style:dashed}
#crossweave-flow-001 .cf-card.zero .cf-art{opacity:.45}
#crossweave-flow-001 .cf-card[aria-expanded=true]{border-color:var(--cf-accent);box-shadow:0 0 0 2px var(--cf-accent)}
#crossweave-flow-001 .cf-art{display:flex;align-items:center;justify-content:center;min-height:64px;border-radius:5px;background:radial-gradient(ellipse at 45% 45%,light-dark(#f3ead2,#91a18266),transparent 70%),linear-gradient(145deg,light-dark(#b8c9b9,#385949),light-dark(#d4c6a2,#6b6d4b));color:light-dark(#516755,#e3e3bd)}
#crossweave-flow-001 .cf-art i[data-lucide],#crossweave-flow-001 .cf-art svg.lucide{width:40px;height:40px;font-size:36px;stroke-width:1.35}
#crossweave-flow-001 .cf-card-name{font-size:13px;overflow-wrap:anywhere}
#crossweave-flow-001 .cf-count{position:absolute;right:6px;top:6px;min-width:26px;padding:1px 6px;text-align:center;border-radius:14px;font-size:12px;background:var(--cf-paper);box-shadow:0 1px 3px var(--cf-shadow)}
#crossweave-flow-001 .cf-attr{position:absolute;left:7px;top:6px;font-size:12px;background:var(--cf-paper);border-radius:3px;padding:0 4px}
#crossweave-flow-001 .cf-new{position:absolute;right:7px;bottom:25px;font-size:11px;color:var(--cf-active-ink);background:var(--cf-active);padding:0 5px;border-radius:8px}
#crossweave-flow-001 .cf-scroll-cue{position:absolute;right:14px;bottom:7px;width:32px;height:32px;border-radius:50%;border:1px solid var(--cf-line);background:var(--cf-paper);box-shadow:0 2px 10px var(--cf-shadow)}
#crossweave-flow-001 .cf-error{min-height:24px;padding:2px 4px;color:var(--cf-warn);font-size:12px}
#crossweave-flow-001 #cf-return{display:flex;flex-direction:column;margin:10px auto 0;width:90%;height:calc(100% - 10px);padding:20px 24px;background:light-dark(#f0eadbec,#25332fe8);border-radius:8px 8px 0 0;overflow:auto;backdrop-filter:blur(3px)}
#crossweave-flow-001 .cf-result-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
#crossweave-flow-001 .cf-result-mark{font-size:12px;color:var(--cf-muted);border:1px solid var(--cf-line);padding:2px 9px;border-radius:12px}
#crossweave-flow-001 .cf-result-story{color:var(--cf-muted);margin-bottom:20px}
#crossweave-flow-001 .cf-result-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;margin-top:20px;flex:1;align-content:start}
#crossweave-flow-001 .cf-result-items{display:flex;align-items:stretch;flex-wrap:wrap;gap:14px;margin-top:10px}
#crossweave-flow-001 .cf-point-tile{display:grid;gap:2px;place-content:center;justify-items:center;min-width:115px;padding:16px;background:light-dark(#d5dece,#405143);border-radius:6px}
#crossweave-flow-001 .cf-point-tile strong{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
#crossweave-flow-001 .cf-unlock{max-width:145px;min-width:125px}
#crossweave-flow-001 .cf-unlock .cf-card{width:100%;min-height:128px}
#crossweave-flow-001 .cf-record-link{display:flex;align-items:center;gap:10px;justify-content:space-between;background:none;color:var(--cf-ink);border:0;border-bottom:1px solid var(--cf-line);padding:10px 0;width:100%;text-align:left}
#crossweave-flow-001 .cf-loss{color:var(--cf-warn);margin-top:18px;font-size:13px}
#crossweave-flow-001 .cf-loss span{display:block;margin-top:5px}
#crossweave-flow-001 .cf-empty{color:var(--cf-muted);padding:14px 0}
#crossweave-flow-001 #cf-departure{display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at 50% 35%,light-dark(#729c9966,#37635c55),light-dark(#899f95cc,#243a36ee));border-radius:8px 8px 0 0}
#crossweave-flow-001 #cf-departure>div{display:grid;gap:15px;justify-items:center;padding:25px}
#crossweave-flow-001 #cf-departure p{color:var(--cf-muted)}
#crossweave-flow-001 #cf-windows{position:absolute;inset:0;pointer-events:none;z-index:5}
#crossweave-flow-001 .cf-window{pointer-events:auto;position:absolute;inset:6% 4%;max-height:90%;padding:18px 22px;overflow:auto;border:1px solid var(--cf-line);border-radius:9px;background:light-dark(#f4efdfef,#27372fef);box-shadow:0 10px 32px var(--cf-shadow);backdrop-filter:blur(4px)}
#crossweave-flow-001 .cf-window[data-size=small]{inset:auto;width:340px;max-width:calc(100% - 16px);max-height:calc(100% - 16px);padding:16px 18px}
#crossweave-flow-001 .cf-window-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
#crossweave-flow-001 .cf-window-tools{display:flex;gap:10px;align-items:center;color:var(--cf-muted)}
#crossweave-flow-001 .cf-close{border:0;background:transparent;width:28px;height:28px;padding:2px;font-size:20px}
#crossweave-flow-001 .cf-quest-content{display:grid;grid-template-columns:minmax(160px,.8fr) minmax(0,1.3fr);gap:25px}
#crossweave-flow-001 .cf-quest-cover{display:flex;align-items:end;min-height:205px;padding:18px;background:radial-gradient(ellipse at 55% 0,light-dark(#c0d0ba,#b9b79655),transparent 50%),repeating-linear-gradient(-8deg,transparent 0 22%,light-dark(#cfdbcb55,#b1cdb12a) 24% 25%,transparent 26% 31%),linear-gradient(150deg,light-dark(#647d74,#2c403b),light-dark(#acbfb4,#496b64));border-radius:5px;color:light-dark(#faf5df,#edf0d7)}
#crossweave-flow-001 .cf-quest-cover h3{font-size:24px}
#crossweave-flow-001 .cf-quest-copy{display:grid;align-content:start;gap:15px}
#crossweave-flow-001 .cf-quest-copy details{font-size:13px;color:var(--cf-muted)}
#crossweave-flow-001 .cf-quest-copy summary{cursor:pointer;padding-bottom:5px}
#crossweave-flow-001 .cf-quest-copy .cf-primary{justify-self:start;margin-top:5px}
#crossweave-flow-001 .cf-detail-art{float:left;width:68px;height:68px;margin:0 14px 12px 0}
#crossweave-flow-001 .cf-detail-attr{font-size:12px;color:var(--cf-muted);margin-bottom:6px}
#crossweave-flow-001 .cf-data{clear:both;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:15px 0;font-size:13px}
#crossweave-flow-001 .cf-data dt{color:var(--cf-muted)}#crossweave-flow-001 .cf-data dd{margin:0;text-align:right}
#crossweave-flow-001 .cf-stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--cf-line);padding-top:12px}
#crossweave-flow-001 .cf-stepper>div{display:flex;align-items:center;gap:12px}
#crossweave-flow-001 .cf-stepper button{width:34px;height:32px;font-size:18px;padding:0}
#crossweave-flow-001 .cf-record-list{margin:0;padding:0;list-style:none}
#crossweave-flow-001 .cf-record-list li{padding:13px 0;border-top:1px solid var(--cf-line)}
#crossweave-flow-001 .cf-record-list p{margin-top:5px;color:var(--cf-muted);font-size:13px}
@container cf-flow (max-width:760px){#crossweave-flow-001 .cf-shell{min-height:510px}#crossweave-flow-001 .cf-card-grid{gap:8px;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:130px}#crossweave-flow-001 .cf-stage{margin-inline:10px}#crossweave-flow-001 #cf-balance{display:none}#crossweave-flow-001 .cf-bottom{padding-inline:10px;gap:6px}#crossweave-flow-001 .cf-self{gap:8px}#crossweave-flow-001 .cf-quiet,#crossweave-flow-001 .cf-primary{padding-inline:7px}#crossweave-flow-001 #cf-return{width:98%;padding:18px}#crossweave-flow-001 .cf-result-grid{gap:16px}}
@container cf-flow (max-width:520px){#crossweave-flow-001 .cf-shell{aspect-ratio:auto;height:640px}#crossweave-flow-001 .cf-top{padding:8px 14px}#crossweave-flow-001 .cf-shop-title{top:8%}#crossweave-flow-001 .cf-request-paper{left:8%;top:37%;max-width:84%;width:250px}#crossweave-flow-001 .cf-bottom{flex-wrap:wrap;justify-content:center;padding:6px 8px;gap:4px}#crossweave-flow-001 .cf-self{width:100%;justify-content:space-between}#crossweave-flow-001 nav{width:100%;justify-content:space-between;gap:1px}#crossweave-flow-001 .cf-quiet,#crossweave-flow-001 .cf-primary{min-height:38px;padding:5px 6px;font-size:13px}#crossweave-flow-001 .cf-card-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:143px}#crossweave-flow-001 .cf-prep-heading h2{font-size:22px}#crossweave-flow-001 #cf-preparation{padding:10px 7px 3px}#crossweave-flow-001 .cf-prep-heading .cf-quiet{max-width:95px;gap:3px}#crossweave-flow-001 .cf-window{inset:3% 1%;max-height:94%;padding:14px}#crossweave-flow-001 .cf-quest-content{grid-template-columns:1fr;gap:14px}#crossweave-flow-001 .cf-quest-cover{min-height:95px;padding:12px}#crossweave-flow-001 .cf-result-grid{grid-template-columns:1fr;gap:18px}#crossweave-flow-001 .cf-result-story{font-size:13px}#crossweave-flow-001 #cf-return{padding:14px}#crossweave-flow-001 .cf-hub-message{max-width:80%;right:5%;bottom:6%}#crossweave-flow-001 #cf-context{max-width:60%;text-align:right}}
@media(pointer:coarse){#crossweave-flow-001 button,#crossweave-flow-001 .cf-stepper button,#crossweave-flow-001 select{min-height:44px}#crossweave-flow-001 .cf-close{min-width:44px}#crossweave-flow-001 .cf-example-bar select{font-size:16px}}
@media(prefers-reduced-motion:reduce){#crossweave-flow-001 *{scroll-behavior:auto!important}}
#crossweave-flow-001{container-type:inline-size;container-name:cf-flow}
</style>
  <div class="cf-example-bar" aria-label="構成試作の表示例">
    <span>構成試作</span>
    <label>表示例 <select id="cf-example"><option value="initial">出発前</option><option value="clear">踏破後</option><option value="withdrawal">撤退後</option><option value="defeat">緊急脱出後</option></select></label>
    <span id="cf-boundary-note" role="status"></span>
  </div>
  <div class="cf-shell">
    <div class="cf-scene" aria-hidden="true">
      <div class="cf-light"></div><div class="cf-window-light"></div>
      <div class="cf-shelves"><b></b><b></b><b></b><b></b><b></b><b></b></div>
      <div class="cf-curtain"></div><div class="cf-floor"></div><div class="cf-counter"></div><div class="cf-lamp"></div>
    </div>
    <header class="cf-top"><span id="cf-location">古道具屋</span><span id="cf-context"></span></header>
    <main class="cf-stage">
      <section id="cf-hub" aria-label="古道具屋">
        <div class="cf-shop-title"><span>crossweave</span><h2>古道具屋</h2></div>
        <button type="button" class="cf-request-paper" data-open="quest"><span class="cf-pin-dot" aria-hidden="true"></span><span class="cf-small">依頼</span><strong>夜潮の排水路</strong><span id="cf-hub-symptom">地下へ入り込む海水</span><span class="cf-paper-go" aria-hidden="true">↗</span></button>
        <div class="cf-hub-message" id="cf-hub-message"></div>

  if(button.dataset.action==='depart') {
    departureRequest=model.depart();render();
    if(departureRequest)root.dispatchEvent(new CustomEvent('crossweave:departure-preview',{detail:departureRequest,bubbles:true}));return;
  }
  if(button.id==='cf-more') {
    get('cf-card-grid').scrollBy({top:Math.max(120,get('cf-card-grid').clientHeight*.7),behavior:window.matchMedia?.('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  }
});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&model.inspect().dialog){e.preventDefault();close(true);}});
get('cf-example').addEventListener('change',e=>{clearTimers();model.example(e.target.value);departureRequest=null;render();});
get('cf-card-grid').addEventListener('scroll',()=>{if(model.inspect().windowMode==='peek'&&model.inspect().dialog)close();else positionSmall();cue();},{passive:true});
root.addEventListener('pointerover',e=>{
  if(e.pointerType!=='mouse'||!window.matchMedia?.('(hover: hover) and (pointer: fine)').matches)return;
  if(e.target.closest('.cf-window')){clearTimeout(closeTimer);return;}
  const card=e.target.closest('[data-card]');if(!card||card.contains(e.relatedTarget))return;
  clearTimers();hoverTimer=setTimeout(()=>open('card',card.dataset.card,'peek',card),180);
});
root.addEventListener('pointerout',e=>{
  if(e.pointerType!=='mouse')return;
  const card=e.target.closest('[data-card]'),win=e.target.closest('.cf-window');
  if(!card&&!win)return;
  if(card?.contains(e.relatedTarget)||win?.contains(e.relatedTarget)||e.relatedTarget?.closest?.('.cf-window'))return;
  clearTimers();closeTimer=setTimeout(()=>{if(model.inspect().windowMode==='peek')close();},180);
});
window.addEventListener('blur',()=>{clearTimers();if(model.inspect().windowMode==='peek')close();});
if(typeof ResizeObserver!=='undefined') new ResizeObserver(()=>{positionSmall();cue();}).observe(root);
render();


})();</script>
</div>
</body></html>
