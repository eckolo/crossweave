<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>crossweave — 場面から確認</title>
  <link rel="stylesheet" href="../dist/crossweave-ui.css">
  <style>
    body{margin:0;padding:12px 0;background:#f7f8f4;color:#263c32;font-family:system-ui,sans-serif}
    [data-review]{max-width:1920px;margin:auto}
    .review-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px;padding-inline:12px}
    .review-controls select,.review-controls button{font:inherit;padding:5px 8px;max-width:100%}
    .review-controls small{flex-basis:100%}
    [data-review-status]{min-height:1.5em;margin:6px 12px;font-size:14px}
  </style>
</head>
<body>
  <div data-review>
    <header class="review-controls">
      <strong>確認用</strong>
      <label for="review-case">場面</label><select id="review-case" data-review-case></select>
      <button type="button" data-review-open>この場面を最初から</button>
      <small>実データ・一時保存。場面の切替やページを閉じると、この確認中の操作は残りません。通常のセーブには影響しません。</small>
    </header>
    <p data-review-status role="status" aria-live="polite"></p>
    <div id="crossweave-journey"></div>
  </div>
  <script src="../dist/crossweave-ui.js"></script>
  <script type="module" src="entry.mjs"></script>
</body>
</html>
