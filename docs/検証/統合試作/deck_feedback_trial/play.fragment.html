<div id="cw-deck-hunt" aria-label="crossweave 山札確認と継続探索">
  <div class="cw-top"><strong>crossweave</strong><span id="cw-phase"></span></div>
  <div id="cw-progress" class="cw-meta"></div>
  <div id="cw-queue" class="cw-meta"></div>
  <div id="cw-start-state" class="cw-meta"></div>
  <div id="cw-actors" class="cw-actors"></div>
  <div class="cw-section">共有の場</div>
  <div id="cw-field" class="cw-field"></div>
  <div class="cw-section">手札</div>
  <div id="cw-hand" class="cw-hand"></div>
  <div id="cw-prediction" class="cw-prediction" aria-live="polite"></div>
  <button id="cw-use" class="cw-primary" type="button">この札を使う</button>
  <div id="cw-outcome" aria-live="polite"></div>
  <details id="cw-deck-panel" open><summary id="cw-deck-title">自分の山札と札の効果</summary><div id="cw-deck"></div></details>
  <div class="cw-section">直前の経過</div>
  <div id="cw-last" aria-live="polite"></div>
  <details><summary>持込・補給・報酬</summary><div id="cw-resources"></div></details>
  <details><summary>相手の傾向・確認した札</summary><div id="cw-knowledge"></div></details>
  <details><summary>ここまでの経過</summary><div id="cw-history"></div></details>
  <div class="cw-bottom"><button id="cw-withdraw" type="button">撤退する</button><button id="cw-restart" type="button">入口から試す</button><button id="cw-recovery" type="button">被弾後の判断局面から</button></div>
</div>
<style>
#cw-deck-hunt{--cw-paper:light-dark(#f7f5ee,#232720);--cw-ink:light-dark(#273b34,#edf2e9);--cw-line:light-dark(#c5cbbf,#535e50);--cw-soft:light-dark(#e8ede2,#323c2f);--cw-selected:light-dark(#345747,#c2d8ba);--cw-selected-ink:light-dark(#ffffff,#1f301e);--cw-danger:light-dark(#994130,#ffc1a6);color:var(--cw-ink);background:var(--cw-paper);padding:16px;border-radius:12px;font-family:inherit;overflow-wrap:anywhere;color-scheme:light dark}
#cw-deck-hunt *{box-sizing:border-box}
#cw-deck-hunt button{font:inherit;color:var(--cw-ink);background:var(--cw-paper);border:1px solid var(--cw-line);border-radius:8px;padding:10px 12px;cursor:pointer;min-height:44px;white-space:normal;text-align:left}
#cw-deck-hunt button[aria-pressed="true"],#cw-deck-hunt .cw-primary{color:var(--cw-selected-ink);background:var(--cw-selected);border-color:var(--cw-selected)}
#cw-deck-hunt button:disabled{opacity:.55;cursor:default}
#cw-deck-hunt .cw-top,#cw-deck-hunt .cw-bottom{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
#cw-deck-hunt .cw-meta{padding:8px 0;font-variant-numeric:tabular-nums}
#cw-deck-hunt .cw-section{font-weight:500;margin:14px 0 6px}
#cw-deck-hunt .cw-actors{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:8px}
#cw-deck-hunt .cw-actor{padding:10px;border-radius:8px;background:var(--cw-soft)}
#cw-deck-hunt .cw-actors button{background:var(--cw-soft)}
#cw-deck-hunt .cw-actors button[aria-pressed="true"]{background:var(--cw-selected)}
#cw-deck-hunt .cw-field{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
#cw-deck-hunt .cw-slot{padding:8px;border:1px solid var(--cw-line);border-radius:8px;min-width:0}
#cw-deck-hunt .cw-hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
#cw-deck-hunt .cw-hand button{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#cw-deck-hunt .cw-name{font-weight:500}
#cw-deck-hunt .cw-prediction{margin:12px 0;padding:12px;background:var(--cw-soft);border-radius:8px}
#cw-deck-hunt .cw-loss{color:var(--cw-danger)}
#cw-deck-hunt .cw-primary{width:100%;text-align:center}
#cw-deck-hunt details{margin-top:12px;border-top:1px solid var(--cw-line);padding-top:8px}
#cw-deck-hunt summary{cursor:pointer;min-height:36px;padding:6px 0}
#cw-deck-hunt .cw-bottom{margin-top:16px}
#cw-deck-hunt .cw-log{padding:5px 0}
#cw-deck-hunt strong{font-weight:500}
#cw-deck-hunt progress{width:100%;accent-color:var(--cw-selected);display:block;margin:6px 0}
#cw-deck-hunt ul{padding-left:20px;margin:6px 0}
@media(max-width:480px){#cw-deck-hunt .cw-field{grid-template-columns:repeat(2,minmax(0,1fr))}#cw-deck-hunt .cw-actors{grid-template-columns:repeat(2,minmax(0,1fr))}}
#cw-deck-hunt .cw-deck-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--cw-line)}
@media(max-width:480px){#cw-deck-hunt .cw-deck-row{grid-template-columns:1fr;gap:4px}}
</style>
<script>
__CW_ENGINE__
__CW_FEEDBACK__
(() => {
  const bundle=CWFeedback.prepare(__CW_DATA__,'roles');
  const recovery=__CW_RECOVERY__;
  const root=document.getElementById('cw-deck-hunt');
  const get=id=>root.querySelector('#'+id);
  const names={P:'あなた',O:'大岩',V0:'最初の環境',V1:'後続の環境',E1:'後続の敵'};
  const phases={rock:'大岩のある区間',open_rock:'開通後の区間',followup:'後続の区間',finished:'探索終了'};
  const rewardNames={R:'大岩の成果',T0:'最初の踏破成果',E:'敵の成果',T1:'後続の踏破成果'};
  const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const signed=n=>n>0?'+'+n:String(n);
  const cardName=c=>c.name+(c.type.startsWith('weak_')||c.type.startsWith('filler_')?' '+c.attr:'');
  const fieldText=c=>`攻撃／防御 ${signed(c.field_power)}<br>命中／回避 ${signed(c.field_hit)}`;
  let game,selected=null,target='V0',history=[],last=[],knownAttrs=new Set(),startMode='entrance';
  function logText(r) {
    if(r.type==='action'){
      const c=game.s.cards[r.card_id],who=names[r.actor];let result;
      if(r.mode==='place')result=`${who}：${cardName(c)}を${c.attr}の場へ設置`;
      else if(r.mode==='attack')result=`${who}：${cardName(c)} → ${names[r.target]}。${r.hit_connected?`HP −${r.actual_hp_loss}`:`未命中、命中蓄積 +${r.hit_gain}`}`;
      else if(r.mode==='guard')result=`${who}：${cardName(c)}で防御を開始`;
      else if(r.mode==='heal')result=`${who}：${cardName(c)}でHP +${r.hp_restored}`;
      else result=`${who}：${cardName(c)}が一致、会心 +${r.crit_added}`;
      if(r.mode!=='place'&&c.consume_on_recover)result+='。使用札は消滅';
      if(r.actor==='P'&&r.expired.length)result+='。期限切れ：'+r.expired.map(id=>cardName(game.s.cards[id])+(game.s.cards[id].consume_on_recover?'（消滅）':'')).join('、');
      return result;
    }
    if(r.type==='rebuild')return `${names[r.actor]}：山札を再構築（${r.cycle}巡目）`;
    if(r.type==='boundary')return {rock_destroyed:'大岩を破壊し、後続の区間へ',V0_traversed:'最初の環境を踏破。ここまでの獲得成果を保護',enemy_defeated:'敵を撃破し、成果を獲得',V1_traversed:'後続の環境を踏破し、探索クリア',player_defeated:'HPが尽き、探索終了'}[r.event];
    return null;
  }
  function absorb(){last=game.trace.map(logText).filter(Boolean);history.push(...last);game.trace=[];}
  function start(mode='entrance'){
    startMode=mode;selected=null;target=mode==='recovery'?'V1':'V0';history=[];knownAttrs=new Set();
    game=new CWCardStats.Game(bundle);
    if(mode==='recovery'){
      for(const choice of recovery.prefix){game.advance();game.step(choice);absorb();}
    }
    game.advance();absorb();render();
  }
  function guardText(a){return a.guard?`防御 ${a.guard.value}／回避 ${signed(a.guard.evasion)}／残${a.guard.uses}回`:'防御なし';}
  function previewText(c,pred){
    const p=game.s.actors.P,m=game.s.field[c.attr];let text;
    if(pred.mode==='place')text=`${c.attr}の場へ設置。次に一致した札へ、${fieldText(c).replace('<br>','、')}。`;
    else if(pred.mode==='attack'){
      const d=game.s.actors[target],total=d.hit+pred.hit_gain;
      text=`${names[target]}：${pred.hit_connected?'命中':'未命中'}、HP ${d.hp} → ${d.hp-pred.actual_hp_loss}。命中蓄積 ${d.hit} → ${pred.hit_connected?0:total}。`;
    } else if(pred.mode==='guard')text=`防御 ${pred.guard.value}・回避 ${signed(pred.guard.evasion)}、命中した攻撃へ残2回。`;
    else if(pred.mode==='heal')text=`HP ${p.hp} → ${p.hp+pred.hp_restored}（回復 +${pred.hp_restored}、余剰 ${c.power-pred.hp_restored}）。`;
    else text='主効果なし。';
    if(m)text+=` 会心 +${pred.crit_added}。`;
    text+=` 自分の次回予定：時刻 ${game.s.now+game.cost(c.type,!!m)}。`;
    if(p.guard)text+=m?' 現在の防御・回避は終了。':' 現在の防御・回避を保持。';
    const losses=[];
    if(m&&(c.consume_on_recover||c.doomed||c.birth==='filler'))losses.push('使用札の'+cardName(c));
    if(m){const material=game.s.cards[m];if(material.consume_on_recover||material.doomed||material.birth==='filler')losses.push('場の'+cardName(material));}
    if(losses.length)text+=`<div class="cw-loss">この手で消滅：${esc(losses.join('、'))}</div>`;
    const expired=p.hand.filter(id=>id!==c.id&&game.s.cards[id].remaining===1);
    if(expired.length)text+='<div>この手の後に期限切れ：'+expired.map(id=>esc(cardName(game.s.cards[id]))+(game.s.cards[id].consume_on_recover?'（消滅）':'（回収）')).join('、')+'</div>';
    return text;
  }
  function render(){
    const s=game.public(),p=s.actors.P,active=Object.keys(s.actors).filter(w=>w!=='P'&&s.actors[w].active);
    if(!active.includes(target))target=active[0]||null;
    if(!p.hand.some(c=>c.id===selected))selected=p.hand[0]?.id||null;
    get('cw-phase').textContent=phases[s.current_event];
    get('cw-start-state').textContent=startMode==='recovery'?`開始局面：${recovery.at_action}手目・HP ${recovery.hp}/60・山札${recovery.rebuilds+1}巡目`:'会心・防御札の調整試遊';
    get('cw-progress').textContent=`自分の${p.actions+(!s.outcome?1:0)}手目 · 山札${p.rebuilds+1}巡目（再構築${p.rebuilds}回） · 残り${p.deck_count}枚 · 共通回収山${s.pool_count}枚`;
    const queue=active.filter(w=>s.actors[w].acts).sort((a,b)=>s.actors[a].next_at-s.actors[b].next_at||({V:0,P:1,E:2}[s.actors[a].role]-{V:0,P:1,E:2}[s.actors[b].role]));
    get('cw-queue').textContent=`現在時刻 ${s.now} · 相手の予約：${queue.map(w=>names[w]+' '+s.actors[w].next_at).join('／')||'なし'}`;
    get('cw-actors').innerHTML=['P',...active].map(w=>{
      const a=s.actors[w],body=`<strong>${names[w]}</strong><div>HP ${a.hp} / ${a.max_hp}</div><progress max="${a.max_hp}" value="${a.hp}" aria-label="${names[w]}のHP"></progress><div>命中蓄積 ${a.hit} · 会心 ${a.crit}</div><div>${guardText(a)}</div>${a.reduction?`<div>常時軽減 ${a.reduction}</div>`:''}${w==='V0'&&game.s.actors.O.active?'<div>大岩の回避支援 +20</div>':''}`;
      return w==='P'?`<div class="cw-actor">${body}</div>`:`<button type="button" data-target="${w}" aria-label="攻撃対象：${names[w]}" aria-pressed="${target===w}">${body}</button>`;
    }).join('');
    get('cw-field').innerHTML=CWFeedback.attributes(game,knownAttrs).map(attr=>{const c=s.field[attr];return `<div class="cw-slot"><strong>${esc(attr)}</strong><div>${c?esc(cardName(c)):'空き'}</div>${c?`<div>${fieldText(c)}</div>${c.consume_on_recover||c.doomed?'<div>次の回収で消滅</div>':''}`:''}</div>`;}).join('');
    get('cw-hand').innerHTML=p.hand.map(c=>{
      const main=c.kind==='attack'?`攻撃 ${c.power}／命中 ${c.hit}`:c.kind==='guard'?`防御 ${c.power}／回避 ${signed(c.evasion)}`:c.kind==='heal'?`自分を ${c.power} 回復`:'主効果なし';
      const action=s.field[c.attr]?'一致して使う':'場へ置く';
      return `<button type="button" data-card="${c.id}" aria-pressed="${selected===c.id}"><span class="cw-name">${esc(cardName(c))} / ${c.attr}</span><span>主効果：${main}<br>会心増加 ${signed(c.crit_gain)}</span><span>場：${fieldText(c)}</span><span>残り${c.remaining}手 · ${action}</span>${c.consume_on_recover?'<span>回収時に消滅</span>':c.doomed?'<span>退場由来：次の回収で消滅</span>':''}</button>`;
    }).join('');
    const c=p.hand.find(c=>c.id===selected);
    if(c&&!s.outcome){const choice={card_id:c.id,target:c.kind==='attack'&&s.field[c.attr]?target:null};get('cw-prediction').innerHTML='<strong>今回の結果</strong><div>'+previewText(c,game.predict(choice))+'</div>';}
    else get('cw-prediction').textContent='探索は終了しています。';
    get('cw-use').disabled=!!s.outcome||!c;get('cw-withdraw').disabled=!!s.outcome;
    get('cw-outcome').textContent=s.outcome?({clear:'探索クリア。今回の獲得成果を全て持ち帰ります。',defeat:'死亡。今回の獲得成果は全て失います。',withdrawal:'撤退。保護済みの成果を持ち帰ります。',cutoff:'試行上限の160手に到達。報酬は未精算です。'}[s.outcome]):'';
    get('cw-last').innerHTML=last.map(x=>'<div class="cw-log">'+esc(x)+'</div>').join('')||'まだ行動していません。';
    get('cw-deck-title').textContent=`自分の山札：残り${p.deck_count}枚 · 全種類の属性と効果`;
    get('cw-deck').innerHTML=`<div class="cw-meta">残数は未ドロー分。手札・初期持込とは別集計です。</div><div class="cw-deck-list">`+CWFeedback.catalogue(game).map(row=>{
      const c=row.card;
      return `<div class="cw-deck-row"><div><strong>${esc(cardName(c))} / ${esc(c.attr)}</strong><div>山札 残${row.remaining}枚 · 手札 ${row.hand}枚 · 持込 ${row.initial}枚</div>${row.doomed_remaining?`<div class="cw-loss">山札内${row.doomed_remaining}枚：退場由来で次の回収時に消滅</div>`:''}</div><div>主効果：${CWFeedback.mainText(c)}<br>会心増加 ${signed(c.crit_gain)} · 期限 ${c.life}手<br>場：${fieldText(c)}<br>行動コスト 設置${c.place_cost}／一致${c.match_cost}${c.consume_on_recover?'<br>回収時に消滅':''}</div></div>`;
    }).join('')+'</div>';
    get('cw-history').innerHTML=history.map(x=>'<div class="cw-log">'+esc(x)+'</div>').join('');
    const initial=bundle.initial.state,counts={};
    for(const id of initial.actors.P.deck){const c=initial.cards[id],name=cardName(c)+' / '+c.attr;counts[name]=(counts[name]||0)+1;}
    const healId=initial.actors.P.deck.find(id=>initial.cards[id].consume_on_recover),heal=game.s.cards[healId];
    const rewards=Object.entries(s.rewards).map(([k,r])=>`${rewardNames[k]}：${r.protected?'保護済み':'未保護'}`);
    get('cw-resources').innerHTML=`<div>持込12枚：${esc(Object.entries(counts).map(([n,v])=>n+' ×'+v).join('、'))}</div><div>回復草：${heal.destroyed?'消滅済み':'探索内に残存'}。回収時に消滅し、この探索中の追加補給はありません。</div><div>次の新しい探索では、解放済みの消費札を補充費なしで再セットできます。</div><div>${rewards.length?esc(rewards.join('／')):'獲得成果なし'}</div>`;
    const personality={V0:'あなたを攻撃',V1:'生存しているあなた／敵を等確率で攻撃',E1:'あなたへの一致攻撃を優先'};
    get('cw-knowledge').innerHTML=active.filter(w=>w!=='O').map(w=>{
      const types=game.memory.observed_types[w]||[],labels=types.map(type=>{const c=Object.values(game.s.cards).find(v=>v.type===type);return c?cardName(c):type;});
      return `<div class="cw-log"><strong>${names[w]}</strong>：${personality[w]}<br>確認した種類：${labels.length?esc(labels.join('、')):'まだなし'}</div>`;
    }).join('')+'<div>確認した種類は、現在の手札・山札の内容を示すものではありません。</div>';
    root.querySelectorAll('[data-target]').forEach(button=>button.addEventListener('click',()=>{target=button.dataset.target;render();root.querySelector(`[data-target="${target}"]`)?.focus();}));
    root.querySelectorAll('[data-card]').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.card;render();root.querySelector(`[data-card="${selected}"]`)?.focus();}));
  }
  get('cw-use').addEventListener('click',()=>{
    try{const c=game.s.cards[selected];game.step({card_id:selected,target:c.kind==='attack'&&game.s.field[c.attr]?target:null});game.advance();absorb();selected=null;render();}
    catch(error){get('cw-outcome').textContent='処理を中断しました：'+error.message;get('cw-use').disabled=true;}
  });
  get('cw-withdraw').addEventListener('click',()=>{game.settle('withdrawal');absorb();render();});
  get('cw-restart').addEventListener('click',()=>start('entrance'));
  get('cw-recovery').disabled=!recovery.found;
  get('cw-recovery').addEventListener('click',()=>start('recovery'));
  start();
})();
</script>
